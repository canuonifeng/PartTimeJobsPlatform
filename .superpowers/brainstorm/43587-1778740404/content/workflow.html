<h2>企业端 — 工作流与角色权限</h2>

<div class="section">
  <h3>岗位发布流程</h3>
  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:16px;background:var(--bg-card);border-radius:10px;font-size:13px">
    <span class="label" style="background:#3b82f6;color:white">草稿</span>
    <span>→</span>
    <span>填写基本信息</span>
    <span>→</span>
    <span>配置薪资规则</span>
    <span>→</span>
    <span style="color:var(--text-secondary)">（可选）配置排班时段</span>
    <span>→</span>
    <span class="label" style="background:#10b981;color:white">预览确认</span>
    <span>→</span>
    <span>📢 发布（直接上架）</span>
  </div>
</div>

<div class="section">
  <h3>发布后的生命周期</h3>
  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:16px;background:var(--bg-card);border-radius:10px;font-size:13px">
    <span class="label" style="background:#10b981;color:white">已发布</span>
    <span>→ 收到应聘 → 筛选面试 → 确认录用</span>
    <span style="margin:0 8px">|</span>
    <span class="label" style="background:#f59e0b;color:white">关闭</span>
    <span style="margin:0 8px">|</span>
    <span class="label" style="background:#6b7280;color:white">过期</span>
    <span style="margin:0 8px">|</span>
    <span class="label" style="background:#3b82f6;color:white">重新发布</span>
  </div>
</div>

<div class="section">
  <h3>企业内角色</h3>
  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:160px;background:var(--bg-card);border-radius:10px;padding:14px;border-top:3px solid #3b82f6">
      <strong>管理员</strong>
      <p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0 0">全部权限</p>
    </div>
    <div style="flex:1;min-width:160px;background:var(--bg-card);border-radius:10px;padding:14px;border-top:3px solid #10b981">
      <strong>HR</strong>
      <p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0 0">岗位发布、人员管理、面试</p>
    </div>
    <div style="flex:1;min-width:160px;background:var(--bg-card);border-radius:10px;padding:14px;border-top:3px solid #8b5cf6">
      <strong>主管</strong>
      <p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0 0">排班管理、考勤确认</p>
    </div>
    <div style="flex:1;min-width:160px;background:var(--bg-card);border-radius:10px;padding:14px;border-top:3px solid #f59e0b">
      <strong>财务</strong>
      <p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0 0">薪资核算、发薪操作</p>
    </div>
  </div>
</div>
