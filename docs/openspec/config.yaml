schema: spec-driven

# Project context (shown to AI when creating artifacts)
context: |
  Tech stack:
    - Backend: Java 17 (JDK 17 required, system default is 11), Spring Boot 3.2.5, Maven
    - Frontend (PC): Vue 3 + Element Plus (Vite)
    - Frontend (Mini Program): UniApp
    - Database: MySQL 8.x (shared instance, 3 separate schemas)
    - Cache: Redis
    - Message Queue: Redis Queue
    - Scheduled Tasks: JDK built-in scheduling primitives
    - ORM: MyBatis 3.x (Spring Boot starter)
    - Migration: Flyway
    - API Docs: SpringDoc OpenAPI 2.3.0
    - Auth: JWT (jjwt 0.12.5) + Spring Security
    - Utility: Lombok, javax.annotation

  Domain: Part-time job SaaS platform — connects enterprises with part-time workers (兼职).

  Services (3 Maven modules):
    1. enterprise-service (com.parttime.enterprise) — Enterprise backend
    2. c-service (com.parttime.cservice) — Worker/C-side backend
    3. platform-service (com.parttime.platform) — Platform admin backend

  Frontend apps (4):
    1. enterprise-pc — Vue 3 + Element Plus (enterprise PC management)
    2. enterprise-uniapp — Enterprise mini-program
    3. worker-uniapp — Worker C-side mini-program
    4. platform-pc — Vue 3 + Element Plus (platform admin PC)

  Data architecture:
    - enterprise-service and c-service share the same MySQL schema (core business data)
    - platform-service has its own schema (admin/ops data)
    - Entity tables are created in enterprise-service Flyway migrations
    - C-side maintains a read-optimized copy of job/application/shift data

  Capability domains (8 specs):
    - job-management: Job CRUD, mixed pay rules, schedule slots, applications
    - schedule-attendance: Schedule templates, shift assignment, check-in/out with geo-location, attendance reports
    - payroll: Wage calculation, batch review/adjust, withdrawal, bulk payment
    - worker-profile: Worker profiles, resumes, evaluations, blacklist, work history
    - enterprise-account: Registration, team management (Admin/HR/Manager/Finance roles), role-based permissions, qualification files
    - worker-user: WeChat OAuth login, job browsing, application, schedule view, check-in, income
    - platform-operations: Enterprise registration review, job report review, dashboard, system config
    - notification: In-app, WeChat template, SMS; template management, delivery logs

rules:
  proposal:
    - Always include "Why", "What Changes", "Capabilities" (New/Modified), and "Impact" sections
    - Impact should cover backend, frontend, database, and infrastructure concerns
  design:
    - Include architecture diagram (ASCII), key data flows, and risk/mitigation table
    - Document design decisions with rationale
    - Specify service boundaries and data sharing strategy
  tasks:
    - Group tasks by capability domain
    - Each task should be independently completable
    - Mark tasks as [x] when completed
    - Include both backend (API + service + mapper) and frontend tasks where applicable
  spec:
    - Use Gherkin-style scenarios (Given/When/Then)
    - Group scenarios under numbered requirements (需求：xxx)
    - Keep specs implementation-agnostic; focus on behavior
  spec-driven:
    - JDK 17 required — export JAVA_HOME=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
    - Use MyBatis XML mappers under src/main/resources/mapper/
    - Use Flyway for DB migrations under src/main/resources/db/migration/
    - APIs documented with SpringDoc OpenAPI annotations (@Operation)
    - Controllers use @Resource for dependency injection
    - Entity classes use Lombok (@Data, @Builder, etc.)
    - Monetary values: DECIMAL in DB, BigDecimal in Java
    - Service layer: interface + impl pattern
    - Package structure: controller → service → mapper → pojo (entity/cmd/vo)
    - Enums stored as VARCHAR in DB
    - JSON columns for complex/flexible data
