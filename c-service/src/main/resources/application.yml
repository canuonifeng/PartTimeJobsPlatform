server:
  port: 8082

spring:
  application:
    name: c-service
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:parttime-cservice-jwt-secret-key-must-be-at-least-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}
  public-base-url: ${FILE_PUBLIC_BASE_URL:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.parttime.cservice.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

wechat:
  app-id: ${WECHAT_APP_ID:mock_app_id}
  app-secret: ${WECHAT_APP_SECRET:mock_app_secret}
  login-url: ${WECHAT_LOGIN_URL:https://api.weixin.qq.com/sns/jscode2session}
  access-token-url: ${WECHAT_ACCESS_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
  phone-number-url: ${WECHAT_PHONE_NUMBER_URL:https://api.weixin.qq.com/wxa/business/getuserphonenumber}
  scheme-url: ${WECHAT_SCHEME_URL:https://api.weixin.qq.com/wxa/generatescheme}
  pay:
    mch-id: ${WECHAT_MCH_ID:your_mch_id}
    api-key: ${WECHAT_API_KEY:your_api_key}
    cert-path: ${WECHAT_CERT_PATH:certs/apiclient_cert.pem}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:certs/apiclient_key.pem}
    notify-url: ${WECHAT_NOTIFY_URL:http://your-domain/api/wechat/notify}
    api-v3-key: ${WECHAT_API_V3_KEY:your_api_v3_key}

cors:
  allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*

  
