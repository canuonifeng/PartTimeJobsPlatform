server:
  port: 8082

spring:
  application:
    name: c-service
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: jdbc:mysql://localhost:3306/part_time_work?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: part_time_work
    password: password123
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

rocketmq:
  name-server: localhost:9876
  producer:
    group: ${spring.application.name}-producer-group

xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    access-token: default_token
    executor:
      appname: ${spring.application.name}
      address: ""
      ip: ""
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

jwt:
  secret: parttime-cservice-jwt-secret-key-must-be-at-least-256-bits
  expiration: 86400000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.parttime.cservice.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

wechat:
  pay:
    mch-id: ${WECHAT_MCH_ID:your_mch_id}
    api-key: ${WECHAT_API_KEY:your_api_key}
    cert-path: ${WECHAT_CERT_PATH:certs/apiclient_cert.pem}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:certs/apiclient_key.pem}
    notify-url: ${WECHAT_NOTIFY_URL:http://your-domain/api/wechat/notify}
    api-v3-key: ${WECHAT_API_V3_KEY:your_api_v3_key}
