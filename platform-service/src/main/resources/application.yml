server:
  port: 8083

spring:
  application:
    name: platform-service

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:parttime-platform-jwt-secret-key-must-be-at-least-256-bits-long-enough}
  expiration: ${JWT_EXPIRATION:86400000}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}
  public-base-url: ${FILE_PUBLIC_BASE_URL:}

feishu:
  robot:
    enabled: ${FEISHU_ROBOT_ENABLED:false}
    webhook-url: ${FEISHU_ROBOT_WEBHOOK_URL:}
    secret: ${FEISHU_ROBOT_SECRET:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.parttime.platform.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
cors:
  allowed-origin-patterns: 