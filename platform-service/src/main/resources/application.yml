server:
  port: 8083

spring:
  application:
    name: platform-service

  datasource:
    url: jdbc:mysql://localhost:3306/part_time_work?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: part_time_work
    password: password123
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

jwt:
  secret: parttime-platform-jwt-secret-key-must-be-at-least-256-bits-long-enough
  expiration: 86400000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.parttime.platform.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
