server:
  port: 8081

spring:
  application:
    name: enterprise-service

  datasource:
    url: jdbc:mysql://localhost:3306/part_time_work?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: part_time_work
    password: password123
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: flyway_schema_history_enterprise

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

rocketmq:
  name-server: localhost:9876
  producer:
    group: ${spring.application.name}-producer-group

xxl:
  job:
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    access-token: default_token
    executor:
      appname: ${spring.application.name}
      address: ""
      ip: ""
      port: 9999
      logpath: /data/applogs/xxl-job/jobhandler
      logretentiondays: 30

jwt:
  secret: parttime-enterprise-jwt-secret-key-must-be-at-least-256-bits
  expiration: 86400000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.parttime.enterprise.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
