server:
  port: 8081

spring:
  application:
    name: enterprise-service
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:parttime-enterprise-jwt-secret-key-must-be-at-least-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}
  public-base-url: ${FILE_PUBLIC_BASE_URL:}

wechat:
  worker-app-id: ${WECHAT_WORKER_APP_ID:mock_worker_app_id}
  worker-app-secret: ${WECHAT_WORKER_APP_SECRET:mock_worker_app_secret}
  customer-app-id: ${WECHAT_CUSTOMER_APP_ID:wx3fdcd5b95534d8f}
  token-url: ${WECHAT_TOKEN_URL:https://api.weixin.qq.com/cgi-bin/token}
  code-url: ${WECHAT_CODE_URL:https://api.weixin.qq.com/wxa/getwxacodeunlimit}

external:
  callback:
    api-key: ${EXTERNAL_CALLBACK_API_KEY:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.parttime.enterprise.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

oss:
  endpoint: ${OSS_ENDPOINT:}
  region: ${OSS_REGION:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  private-bucket: ${OSS_PRIVATE_BUCKET:}
  public-bucket: ${OSS_PUBLIC_BUCKET:}
  sts-role-arn: ${OSS_STS_ROLE_ARN:}
  sts-role-session-name: ${OSS_STS_ROLE_SESSION_NAME:}
